# Branch pushes do not run CI. PR: one job per DSH, Node 22 then 24.
# v* tags: build + npm Trusted Publishing only; no tests or artifact uploads.
name: ci

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compatibility:
    name: Read supported DSH versions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read package compatibility
        id: matrix
        run: node scripts/ci-compatibility.mjs matrix

  verify:
    name: DSH ${{ matrix.dsh-version }} · Node 22 + 24
    needs: compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility.outputs.matrix) }}
    env:
      DSH_TEST_VERSION: ${{ matrix.dsh-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        id: setup22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select exact DSH cohort
        id: cohort
        run: |
          # Validate the committed lock before selecting a different cohort.
          npm ci --ignore-scripts
          CHANGED=$(node scripts/ci-compatibility.mjs select "$DSH_TEST_VERSION")
          if [ "$CHANGED" = 'changed=true' ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Verify Node 22
        id: verify22
        if: ${{ !cancelled() && steps.cohort.outcome == 'success' }}
        run: node scripts/ci-verify.mjs verify 22
      # The packed plugin and browser evidence remain on this runner only.
      - name: Exact full Web host smoke (Node 22)
        id: smoke
        if: ${{ !cancelled() && steps.verify22.outcome == 'success' }}
        run: |
          npm run host:install -- "$DSH_TEST_VERSION"
          npm run test:host -- "$DSH_TEST_VERSION"
      # Node 22 or host failures must not hide the Node 24 result.
      - name: Set up Node 24
        id: setup24
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify Node 24
        id: verify24
        if: ${{ !cancelled() && steps.setup24.outcome == 'success' && steps.cohort.outcome == 'success' }}
        run: node scripts/ci-verify.mjs verify 24
      - name: Test summary
        if: always()
        env:
          SETUP_22: ${{ steps.setup22.outcome }}
          SETUP_24: ${{ steps.setup24.outcome }}
          VERIFY_22: ${{ steps.verify22.outcome }}
          VERIFY_24: ${{ steps.verify24.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        run: node scripts/ci-verify.mjs summary

  publish:
    name: build + npm publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm OIDC requires >=11.5.1. No long-lived npm token is used.
      - name: Ensure npm CLI with trusted publishing support
        run: npm install --global npm@11.6.2
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Version, tag and npm latest gates
        id: gate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-gate.mjs
      - name: Build
        run: npm run build
      # Build is explicit; do not run tests, prepare or prepack on tags.
      - name: Publish (OIDC trusted publishing)
        env:
          DIST_TAG: ${{ steps.gate.outputs.dist-tag }}
        run: npm publish --ignore-scripts --access public --provenance --tag "$DIST_TAG" --registry https://registry.npmjs.org
